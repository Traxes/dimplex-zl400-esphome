<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="470" rx="14" fill="#ffffff"/>
  <text x="30" y="42" font-size="22" font-weight="700" fill="#1b1f1d">How it works</text>
  <text x="30" y="66" font-size="14" fill="#5f6b66">The ESP side and the 24 V side share no copper – only the optocouplers bridge the gap.</text>

  <!-- side labels -->
  <text x="235" y="98" font-size="13" font-weight="700" fill="#6a4c93" text-anchor="middle">ESP SIDE · USB POWER ONLY</text>
  <text x="705" y="98" font-size="13" font-weight="700" fill="#1f5a39" text-anchor="middle">24 V SIDE · FROM THE UNIT</text>

  <!-- isolation barrier -->
  <line x1="470" y1="84" x2="470" y2="440" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="478" y="452" font-size="12" fill="#757575">galvanic isolation ≥ 7.3 mm</text>

  <!-- Home Assistant -->
  <rect x="30" y="160" width="140" height="70" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="100" y="191" font-size="15" font-weight="700" fill="#0d47a1" text-anchor="middle">Home Assistant</text>
  <text x="100" y="212" font-size="12" fill="#1565c0" text-anchor="middle">fan entity, 3 speeds</text>

  <!-- ESP -->
  <rect x="215" y="135" width="190" height="120" rx="10" fill="#f3e5f5" stroke="#6a4c93" stroke-width="2"/>
  <text x="310" y="168" font-size="16" font-weight="700" fill="#4a2c73" text-anchor="middle">XIAO ESP32-C6</text>
  <text x="310" y="190" font-size="12" fill="#4a2c73" text-anchor="middle">ESPHome firmware</text>
  <text x="310" y="210" font-size="12" fill="#4a2c73" text-anchor="middle">300 ms key pulses,</text>
  <text x="310" y="228" font-size="12" fill="#4a2c73" text-anchor="middle">LED feedback check</text>
  <rect x="235" y="320" width="150" height="48" rx="8" fill="#fafafa" stroke="#6a4c93" stroke-width="1.5"/>
  <text x="310" y="342" font-size="13" fill="#4a2c73" text-anchor="middle">USB-C 5 V</text>
  <text x="310" y="359" font-size="11" fill="#757575" text-anchor="middle">(only supply of the ESP)</text>

  <!-- optocouplers -->
  <rect x="425" y="128" width="90" height="62" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
  <text x="470" y="155" font-size="13" font-weight="700" fill="#8d6e00" text-anchor="middle">5 × EL817</text>
  <text x="470" y="174" font-size="11" fill="#8d6e00" text-anchor="middle">inputs</text>
  <rect x="425" y="262" width="90" height="62" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
  <text x="470" y="289" font-size="13" font-weight="700" fill="#8d6e00" text-anchor="middle">2 × EL817</text>
  <text x="470" y="308" font-size="11" fill="#8d6e00" text-anchor="middle">outputs</text>

  <!-- 24 V side blocks -->
  <rect x="555" y="128" width="150" height="62" rx="8" fill="#eaf4ee" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="630" y="155" font-size="12" fill="#1f5a39" text-anchor="middle">+24 V → 10 kΩ</text>
  <text x="630" y="173" font-size="12" fill="#1f5a39" text-anchor="middle">→ opto LED → AUS</text>
  <rect x="555" y="262" width="150" height="62" rx="8" fill="#eaf4ee" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="630" y="287" font-size="12" fill="#1f5a39" text-anchor="middle">2 × MMBT3906 PNP</text>
  <text x="630" y="305" font-size="12" fill="#1f5a39" text-anchor="middle">+24 V via 1 kΩ → EIN</text>
  <rect x="555" y="372" width="150" height="56" rx="8" fill="#eaf4ee" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="630" y="396" font-size="12" fill="#1f5a39" text-anchor="middle">reverse-polarity diodes</text>
  <text x="630" y="414" font-size="12" fill="#1f5a39" text-anchor="middle">LED “24V OK”</text>

  <!-- unit terminals -->
  <rect x="745" y="128" width="150" height="62" rx="8" fill="#eef1f6" stroke="#44546a" stroke-width="2"/>
  <text x="820" y="155" font-size="13" font-weight="700" fill="#2c3a4f" text-anchor="middle">AUS0 … AUS4</text>
  <text x="820" y="174" font-size="11" fill="#44546a" text-anchor="middle">fault, stage 1–3, auto</text>
  <rect x="745" y="262" width="150" height="62" rx="8" fill="#eef1f6" stroke="#44546a" stroke-width="2"/>
  <text x="820" y="289" font-size="13" font-weight="700" fill="#2c3a4f" text-anchor="middle">EIN0 ▲ / EIN1 ▼</text>
  <text x="820" y="308" font-size="11" fill="#44546a" text-anchor="middle">button inputs</text>
  <rect x="745" y="372" width="150" height="56" rx="8" fill="#eef1f6" stroke="#44546a" stroke-width="2"/>
  <text x="820" y="397" font-size="13" font-weight="700" fill="#2c3a4f" text-anchor="middle">+ / −</text>
  <text x="820" y="415" font-size="11" fill="#44546a" text-anchor="middle">24 V from PCB3</text>

  <!-- arrows -->
  <g stroke="#37474f" stroke-width="2" fill="none">
    <line x1="172" y1="195" x2="213" y2="195" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="310" y1="318" x2="310" y2="258" marker-end="url(#a)"/>
    <line x1="423" y1="159" x2="407" y2="159" marker-end="url(#a)"/>
    <line x1="553" y1="159" x2="517" y2="159" marker-end="url(#a)"/>
    <line x1="743" y1="159" x2="707" y2="159" marker-end="url(#a)"/>
    <line x1="407" y1="293" x2="423" y2="293" marker-end="url(#a)"/>
    <line x1="517" y1="293" x2="553" y2="293" marker-end="url(#a)"/>
    <line x1="707" y1="293" x2="743" y2="293" marker-end="url(#a)"/>
    <line x1="743" y1="400" x2="707" y2="400" marker-end="url(#a)"/>
    <path d="M405 225 L 412 225 L 412 293" marker-end="none"/>
  </g>
  <text x="192" y="185" font-size="11" fill="#546e7a" text-anchor="middle">Wi-Fi</text>
</svg>
