<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="600" rx="14" fill="#ffffff"/>
  <text x="30" y="42" font-size="22" font-weight="700" fill="#1b1f1d">Wiring: Controller v3 ↔ Dimplex PCB3 terminal board</text>
  <text x="30" y="66" font-size="14" fill="#5f6b66">9 single wires (Ø 3.5 mm). Terminal names as printed on the boards.</text>

  <!-- Controller -->
  <rect x="40" y="88" width="270" height="420" rx="10" fill="#eaf4ee" stroke="#2e7d4f" stroke-width="2"/>
  <text x="56" y="114" font-size="16" font-weight="700" fill="#1f5a39">Controller v3</text>
  <g font-size="15" fill="#1b1f1d" text-anchor="end">
    <text x="292" y="148">J1  +24V</text>
    <text x="292" y="186">J1  GND</text>
    <text x="292" y="238">J2  AUS0</text>
    <text x="292" y="276">J2  AUS1</text>
    <text x="292" y="314">J2  AUS2</text>
    <text x="292" y="352">J2  AUS3</text>
    <text x="292" y="390">J2  AUS4</text>
    <text x="292" y="442">J3  EIN0</text>
    <text x="292" y="480">J3  EIN1</text>
  </g>

  <!-- PCB3 -->
  <rect x="610" y="88" width="270" height="420" rx="10" fill="#eef1f6" stroke="#44546a" stroke-width="2"/>
  <text x="626" y="114" font-size="16" font-weight="700" fill="#2c3a4f">Dimplex PCB3</text>
  <g font-size="15" fill="#1b1f1d">
    <text x="628" y="148">EIN_1</text><text x="700" y="148" fill="#5f6b66" font-size="13">▼ down button</text>
    <text x="628" y="186">EIN_0</text><text x="700" y="186" fill="#5f6b66" font-size="13">▲ up button</text>
    <text x="628" y="238">+</text><text x="700" y="238" fill="#5f6b66" font-size="13">+24 V DC</text>
    <text x="628" y="276">−</text><text x="700" y="276" fill="#5f6b66" font-size="13">0 V (directly below +)</text>
    <text x="628" y="314">AUS_4</text><text x="700" y="314" fill="#5f6b66" font-size="13">LED Auto</text>
    <text x="628" y="352">AUS_3</text><text x="700" y="352" fill="#5f6b66" font-size="13">LED stage 3</text>
    <text x="628" y="390">AUS_2</text><text x="700" y="390" fill="#5f6b66" font-size="13">LED stage 2</text>
    <text x="628" y="428">AUS_1</text><text x="700" y="428" fill="#5f6b66" font-size="13">LED stage 1</text>
    <text x="628" y="466">AUS_0</text><text x="700" y="466" fill="#5f6b66" font-size="13">LED fault / filter</text>
  </g>

  <!-- wires -->
  <g fill="none" stroke-width="3.2" stroke-linecap="round">
    <path d="M310 143 C 460 143, 460 233, 610 233" stroke="#d32f2f"/>
    <path d="M310 181 C 460 181, 460 271, 610 271" stroke="#212121" stroke-width="4"/>
    <path d="M310 233 C 460 233, 460 461, 610 461" stroke="#1976d2"/>
    <path d="M310 271 C 460 271, 460 423, 610 423" stroke="#1e88e5"/>
    <path d="M310 309 C 460 309, 460 385, 610 385" stroke="#2196f3"/>
    <path d="M310 347 C 460 347, 460 347, 610 347" stroke="#42a5f5"/>
    <path d="M310 385 C 460 385, 460 309, 610 309" stroke="#64b5f6"/>
    <path d="M310 437 C 460 437, 460 181, 610 181" stroke="#ef6c00"/>
    <path d="M310 475 C 460 475, 460 143, 610 143" stroke="#fb8c00"/>
  </g>
  <g fill="#ffffff" stroke-width="2.5">
    <circle cx="310" cy="143" r="6" stroke="#d32f2f"/><circle cx="610" cy="233" r="6" stroke="#d32f2f"/>
    <circle cx="310" cy="181" r="6" stroke="#212121"/><circle cx="610" cy="271" r="6" stroke="#212121"/>
    <circle cx="310" cy="233" r="6" stroke="#1976d2"/><circle cx="610" cy="461" r="6" stroke="#1976d2"/>
    <circle cx="310" cy="271" r="6" stroke="#1e88e5"/><circle cx="610" cy="423" r="6" stroke="#1e88e5"/>
    <circle cx="310" cy="309" r="6" stroke="#2196f3"/><circle cx="610" cy="385" r="6" stroke="#2196f3"/>
    <circle cx="310" cy="347" r="6" stroke="#42a5f5"/><circle cx="610" cy="347" r="6" stroke="#42a5f5"/>
    <circle cx="310" cy="385" r="6" stroke="#64b5f6"/><circle cx="610" cy="309" r="6" stroke="#64b5f6"/>
    <circle cx="310" cy="437" r="6" stroke="#ef6c00"/><circle cx="610" cy="181" r="6" stroke="#ef6c00"/>
    <circle cx="310" cy="475" r="6" stroke="#fb8c00"/><circle cx="610" cy="143" r="6" stroke="#fb8c00"/>
  </g>

  <!-- notes -->
  <rect x="40" y="524" width="840" height="58" rx="8" fill="#fff4e5" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="56" y="547" font-size="14" font-weight="700" fill="#8a3c00">⚠ The GND → “−” wire is required for this controller.</text>
  <text x="56" y="569" font-size="13" fill="#5a3a1a">The original Dimplex panel leaves “−” unconnected. Without it EIN0/EIN1 never switch and the “24V OK” LED stays dark.</text>
  <text x="890" y="66" font-size="12" fill="#5f6b66" text-anchor="end">AUS = unit outputs (LEDs, switched to 0 V) · EIN = unit inputs (active = +24 V)</text>
</svg>
